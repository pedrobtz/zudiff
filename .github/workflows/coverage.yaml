on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/badges/coverage.svg"
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit because the job holds a write token.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@8caf5119301bb2a3bd433b92045b8c75b3097096 # v1.24.0
    permissions:
      contents: write
