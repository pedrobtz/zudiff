# Two checks the shared R CMD check does not make:
#
# - regenerate: builds the Goose compiler from tools/goose/REMOTE at
#   tools/goose/PIN, on Linux and macOS, and verifies
#   that the committed generated C is exactly what tools/goose and the pin
#   produce, so nobody edits src/zudiff_goose.c by hand.
# - symbols: builds the package on Linux, macOS and Windows and fails on
#   any symbol that can end the R process or write to stdout or stderr.
on:
  push:
    branches: [main, master]
  pull_request:

name: goose.yaml

permissions: read-all

jobs:
  regenerate:
    # Both C++ standard libraries: before aardappel/goose#122 was fixed
    # (2c7d8d5), a compiler built with libstdc++ (Linux) emitted some
    # typedefs in a different order than one built with libc++ (macOS).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out Goose at the pin
        run: |
          git clone "$(cat tools/goose/REMOTE)" "$RUNNER_TEMP/goose"
          git -C "$RUNNER_TEMP/goose" checkout "$(cat tools/goose/PIN)"
      - name: Build the Goose compiler
        run: |
          cmake -S "$RUNNER_TEMP/goose" -B "$RUNNER_TEMP/goose/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/goose/build" -j4
      - name: Verify the generated files
        run: tools/regenerate.sh --verify "$RUNNER_TEMP/goose"

  symbols:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Build the shared object
        run: R CMD INSTALL --no-test-load -l "$RUNNER_TEMP" .
      # Windows: the package's own objects, which the install leaves in
      # src/; the DLL also holds MinGW's start-up code (tools/check-symbols.sh).
      - name: Check for forbidden symbols
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            command -v nm >/dev/null || export PATH="$(ls -d /c/rtools4*/x86_64-w64-mingw32.static.posix/bin | tail -1):$PATH"
            tools/check-symbols.sh src/*.o
          else
            tools/check-symbols.sh "$RUNNER_TEMP/zudiff/libs/zudiff.so"
          fi
